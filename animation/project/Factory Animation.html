<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Usine — Animation</title>
<style>
  :root {
    --bg: #0d1b3d;
    --orange: #e8732a;
    --orange-d: #b7541a;
    --blue:   #2e41c6;
    --blue-d:  #1d2a8f;
    --yellow: #f2c022;
    --yellow-d:#c3971a;
    --green:  #4cb98a;
    --green-d:#2f8a63;
    --ink:    #0a1432;
    --roof:   #d8d2c4;
    --roof-d: #b6ae9b;
    --base:   #2c3654;
    --base-d: #1a2240;
    --window: #0c1226;
  }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #fff;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  body { perspective: 2400px; }
  .scene {
    position: relative;
    width: min(96vw, 1200px);
    aspect-ratio: 1448 / 1086;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .scene svg.stage {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    overflow: visible;
  }

  /* ---------- Hotspots ---------- */
  .hotspot {
    position: absolute;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
  }
  /* Colonnes qui couvrent aussi la grange au premier plan */
  .hs-orange { left: 22.0%; top: 26.0%; width: 12.5%; height: 55%; }
  .hs-blue   { left: 34.5%; top: 22.0%; width: 12.0%; height: 59%; }
  .hs-yellow { left: 46.5%; top: 26.0%; width: 13.0%; height: 55%; }
  .hs-green  { left: 66.0%; top: 30.0%; width: 12.0%; height: 52%; }
  .hotspot:focus { outline: none; }
  .hotspot:focus-visible { outline: none; }

  /* ---------- Mise en avant au survol ---------- */
  #barn, #silos, #stacks {
    transition: opacity .35s ease, filter .35s ease;
  }
  #orange-shed, #blue-shed, #yellow-shed, #green-stack {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transition: transform .35s cubic-bezier(.2,.8,.2,1),
                filter .35s ease,
                opacity .35s ease;
    cursor: pointer;
  }
  .scene.focus-orange #orange-shed,
  .scene.focus-blue   #blue-shed,
  .scene.focus-yellow #yellow-shed,
  .scene.focus-green  #green-stack {
    transform: translateY(-22px) scale(1.09);
    filter: drop-shadow(0 22px 34px rgba(0,0,0,.55))
            drop-shadow(0 0 36px rgba(255,255,255,.35));
  }
  /* Les autres sheds s'estompent */
  .scene.focus-orange #blue-shed,
  .scene.focus-orange #yellow-shed,
  .scene.focus-orange #green-stack,
  .scene.focus-blue   #orange-shed,
  .scene.focus-blue   #yellow-shed,
  .scene.focus-blue   #green-stack,
  .scene.focus-yellow #orange-shed,
  .scene.focus-yellow #blue-shed,
  .scene.focus-yellow #green-stack,
  .scene.focus-green  #orange-shed,
  .scene.focus-green  #blue-shed,
  .scene.focus-green  #yellow-shed {
    opacity: .35;
    filter: saturate(.55) brightness(.75);
  }
  /* Grange/silos/cheminées grises s'estompent aussi */
  .scene.focus-orange #barn, .scene.focus-orange #silos, .scene.focus-orange #stacks,
  .scene.focus-blue   #barn, .scene.focus-blue   #silos, .scene.focus-blue   #stacks,
  .scene.focus-yellow #barn, .scene.focus-yellow #silos, .scene.focus-yellow #stacks,
  .scene.focus-green  #barn, .scene.focus-green  #silos, .scene.focus-green  #stacks {
    opacity: .38;
    filter: saturate(.6) brightness(.8);
  }

  /* ---------- Tooltip ---------- */
  .tip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 14px);
    transform: translate(-50%, 8px);
    background: #fff;
    color: var(--ink);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: clamp(12px, 1.15vw, 16px);
    font-weight: 600;
    white-space: nowrap;
    box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 2px 0 rgba(0,0,0,.05) inset;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .tip::after {
    content: "";
    position: absolute;
    left: 50%; top: 100%;
    width: 12px; height: 12px;
    background: #fff;
    transform: translate(-50%, -6px) rotate(45deg);
    border-radius: 2px;
  }
  .hotspot:hover .tip, .hotspot:focus-visible .tip {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .tip .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 10px;
    vertical-align: 1px;
    box-shadow: 0 0 0 2px rgba(0,0,0,.06);
  }
  .tip .dot.orange { background: var(--orange); }
  .tip .dot.blue   { background: var(--blue); }
  .tip .dot.yellow { background: var(--yellow); }
  .tip .dot.green  { background: var(--green); }

  /* ---------- Animations (nuages, fumée) ---------- */
  @keyframes driftA { 0%{transform:translateX(-30px)} 50%{transform:translateX(40px)} 100%{transform:translateX(-30px)} }
  @keyframes driftB { 0%{transform:translateX(25px)}  50%{transform:translateX(-35px)}100%{transform:translateX(25px)} }
  @keyframes driftC { 0%{transform:translateX(-45px)} 50%{transform:translateX(55px)} 100%{transform:translateX(-45px)} }
  .cloud-a { animation: driftA 22s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .cloud-b { animation: driftB 18s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .cloud-c { animation: driftC 28s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .bob-a { animation: bob 6s ease-in-out infinite;     transform-box: fill-box; }
  .bob-b { animation: bob 7s ease-in-out infinite .5s; transform-box: fill-box; }
  .bob-c { animation: bob 8s ease-in-out infinite 1s;  transform-box: fill-box; }

  @keyframes puff {
    0%   { transform: translate(0,0) scale(.5);  opacity: 0; }
    15%  { opacity: .9; }
    70%  { opacity: .5; }
    100% { transform: translate(var(--dx, 10px), -160px) scale(1.5); opacity: 0; }
  }
  .puff { transform-box: fill-box; transform-origin: center; animation: puff 4.5s ease-out infinite; }

  .caption {
    position: absolute;
    left: 50%; bottom: -42px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.55);
    font-size: 13px;
    letter-spacing: .4px;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>

<script>
(function(){
  const scene = document.getElementById('scene');
  // Parallax 3D : la scène s'incline selon la position de la souris
  let rx = 0, ry = 0, tx = 0, ty = 0;
  document.addEventListener('mousemove', (e) => {
    const w = innerWidth, h = innerHeight;
    tx = (e.clientX / w - 0.5) * 2;  // -1..1
    ty = (e.clientY / h - 0.5) * 2;
  });
  function loop() {
    rx += ((-ty * 2) - rx) * 0.06;
    ry += (( tx * 3) - ry) * 0.06;
    scene.style.setProperty('--rx', rx.toFixed(2) + 'deg');
    scene.style.setProperty('--ry', ry.toFixed(2) + 'deg');
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  const map = [
    ['.hs-orange', 'focus-orange'],
    ['.hs-blue',   'focus-blue'],
    ['.hs-yellow', 'focus-yellow'],
    ['.hs-green',  'focus-green'],
  ];
  function clear() {
    scene.classList.remove('focus-orange','focus-blue','focus-yellow','focus-green');
  }
  map.forEach(([sel, cls]) => {
    const el = document.querySelector(sel);
    if (!el) return;
    el.addEventListener('mouseenter', () => { clear(); scene.classList.add(cls); });
    el.addEventListener('mouseleave', clear);
    el.addEventListener('focus',      () => { clear(); scene.classList.add(cls); });
    el.addEventListener('blur',       clear);
  });
})();
</script>
